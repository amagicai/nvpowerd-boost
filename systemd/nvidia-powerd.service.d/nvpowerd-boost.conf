[Service]
# ---------------------------------------------------------------------------
# nvpowerd-boost systemd drop-in
#
# LD_PRELOAD is scoped to nvidia-powerd only.
#
# NVIOC_BOOST_DELTA is the number of MILLIWATTS ADDED to the boost tiers that
# the VBIOS/ACPI reports. It is an increment, NOT an absolute limit.
#
#   NVIOC_BOOST_DELTA=0       stock behaviour, no change        (DEFAULT)
#   NVIOC_BOOST_DELTA=25000   +25 W  (e.g. 175 W -> 200 W)
#
# The effective limit is always clamped to the maximum power limit the driver
# reports (visible as "Max Power Limit" in `nvidia-smi -q -d power`). Raising
# that maximum requires a patched VBIOS loaded through:
#   https://github.com/Panchovix/nvidia-linux-vbios-vix-loader
# This drop-in only controls how much of that headroom nvidia-powerd uses.
#
# Set NVIOC_PATCH=0 to keep the library loaded but only log what it WOULD do.
# ---------------------------------------------------------------------------
Environment=NVIOC_BOOST_DELTA=0
Environment=NVIOC_LOG=/var/log/nvpowerd-boost.log
Environment=LD_PRELOAD=/usr/local/lib/nvpowerd-boost.so
